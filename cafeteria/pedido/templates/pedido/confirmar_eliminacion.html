{% extends "pedido/base.html" %}

{% block title %}Eliminar {{ tipo }} | Cafetería{% endblock %}

{% block content %}
    <h1>Confirmar eliminación</h1>
    <p>¿Seguro que quieres eliminar {{ tipo }} “{{ objeto }}”?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>
    <a href="{% url 'inicio' %}">No, volver</a>
{% endblock %}
