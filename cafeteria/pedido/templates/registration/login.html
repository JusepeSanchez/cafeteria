{% extends "pedido/base.html" %}

{% block title %}Iniciar sesión | Cafetería{% endblock %}

{% block content %}
    <h1>Iniciar sesión</h1>
    {% if form.errors %}
        <p>El usuario o la contraseña no son correctos.</p>
    {% endif %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Ingresar</button>
    </form>
{% endblock %}
